name: Build Booot for Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - '**.pas'
      - '**.dpr'
      - '**.inc'
      - '**.rc'
      - '.github/workflows/android.yml'

jobs:
  build-android:
    # FPC 3.2.0 provides an x86_64 Linux host compiler.
    # The AArch64 Android compiler is a cross compiler running on x86_64 Linux.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            tar \
            unzip \
            zip \
            file \
            binutils-aarch64-linux-gnu

      # ------------------------------------------------------------
      # Free Pascal 3.2.0 host compiler
      # ------------------------------------------------------------
      - name: Download Free Pascal 3.2.0 host compiler
        run: |
          set -euxo pipefail

          FPC_HOST_URL="https://downloads.freepascal.org/fpc/dist/3.2.0/x86_64-linux/fpc-3.2.0-x86_64-linux.tar"

          curl -L --fail --retry 3 \
            -o /tmp/fpc-host.tar \
            "$FPC_HOST_URL"

          mkdir -p "$HOME/fpc"

          tar -xf \
            /tmp/fpc-host.tar \
            -C "$HOME/fpc"

          echo "FPC host package extracted:"
          find "$HOME/fpc" -maxdepth 4 -type f \
            \( -name fpc -o -name ppcx64 \) \
            -print

      # ------------------------------------------------------------
      # Free Pascal 3.2.0 AArch64 Android cross compiler
      #
      # This exact package exists in the official 3.2.0 archive.
      # ------------------------------------------------------------
      - name: Download Free Pascal 3.2.0 AArch64 Android cross compiler
        run: |
          set -euxo pipefail

          CROSS_URL="https://downloads.freepascal.org/fpc/dist/3.2.0/x86_64-linux/fpc-3.2.0-aarch64-android.cross.x86_64-linux.tar"

          curl -L --fail --retry 3 \
            -o /tmp/fpc-aarch64-android-cross.tar \
            "$CROSS_URL"

          tar -xf \
            /tmp/fpc-aarch64-android-cross.tar \
            -C "$HOME/fpc"

          echo
          echo "AArch64 Android cross compiler:"
          find "$HOME/fpc" -type f \
            \( -name ppcrossa64 -o -name '*aarch64-android*' \) \
            -print

      # ------------------------------------------------------------
      # Locate FPC
      # ------------------------------------------------------------
      - name: Locate Free Pascal
        id: fpc
        run: |
          set -euxo pipefail

          FPC_BIN="$(find "$HOME/fpc" \
            -type f \
            -name fpc \
            -perm -111 \
            | head -1)"

          CROSS_FPC="$(find "$HOME/fpc" \
            -type f \
            -name ppcrossa64 \
            -perm -111 \
            | head -1)"

          test -n "$FPC_BIN"
          test -n "$CROSS_FPC"

          echo "FPC_BIN=$FPC_BIN"
          echo "CROSS_FPC=$CROSS_FPC"

          file "$FPC_BIN"
          file "$CROSS_FPC"

          "$FPC_BIN" -iV
          "$CROSS_FPC" -iV

          echo "FPC_BIN=$FPC_BIN" >> "$GITHUB_ENV"
          echo "CROSS_FPC=$CROSS_FPC" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Download Android NDK r20
      #
      # FPC 3.2.0's Android support expects the older NDK layout:
      #
      #   platforms/android-21/arch-arm64/
      #
      # and the aarch64-linux-android-* toolchain.
      # ------------------------------------------------------------
      - name: Download Android NDK r20
        run: |
          set -euxo pipefail

          NDK_URL="https://dl.google.com/android/repository/android-ndk-r20-linux-x86_64.zip"

          curl -L --fail --retry 3 \
            -o /tmp/android-ndk-r20.zip \
            "$NDK_URL"

          mkdir -p "$HOME/android"

          unzip -q \
            /tmp/android-ndk-r20.zip \
            -d "$HOME/android"

          test -d "$HOME/android/android-ndk-r20"

          echo "ANDROID_NDK_HOME=$HOME/android/android-ndk-r20" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Configure Android AArch64 binutils
      # ------------------------------------------------------------
      - name: Configure Android AArch64 toolchain
        run: |
          set -euxo pipefail

          NDK="$ANDROID_NDK_HOME"

          echo "NDK:"
          echo "$NDK"

          echo
          echo "Searching for AArch64 Android toolchain..."

          TOOLCHAIN_BIN="$(
            find "$NDK/toolchains" \
              -type f \
              -name 'aarch64-linux-android-ld' \
              -perm -111 \
              -printf '%h\n' \
              | head -1
          )"

          test -n "$TOOLCHAIN_BIN"

          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN"

          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

          echo
          echo "Android AArch64 tools:"
          command -v aarch64-linux-android-as
          command -v aarch64-linux-android-ld
          command -v aarch64-linux-android-ar
          command -v aarch64-linux-android-ranlib

          file "$(command -v aarch64-linux-android-as)"
          file "$(command -v aarch64-linux-android-ld)"

      # ------------------------------------------------------------
      # Verify the old NDK layout required by FPC 3.2.0
      # ------------------------------------------------------------
      - name: Verify Android NDK layout
        run: |
          set -euxo pipefail

          NDK="$ANDROID_NDK_HOME"

          test -d "$NDK/platforms/android-21"
          test -d "$NDK/platforms/android-21/arch-arm64"

          test -f \
            "$NDK/platforms/android-21/arch-arm64/usr/lib/crtbegin_so.o"

          test -f \
            "$NDK/platforms/android-21/arch-arm64/usr/lib/crtend_so.o"

          echo "Android API 21 AArch64 sysroot found."

          echo
          echo "AArch64 Android libraries:"
          ls -lh \
            "$NDK/platforms/android-21/arch-arm64/usr/lib" \
            | head -30

      # ------------------------------------------------------------
      # Build Booot
      # ------------------------------------------------------------
      - name: Build Booot
        run: |
          set -euxo pipefail

          mkdir -p build

          NDK="$ANDROID_NDK_HOME"
          SYSROOT="$NDK/platforms/android-21/arch-arm64"
          ANDROID_LIB="$SYSROOT/usr/lib"

          echo "Host FPC:"
          "$FPC_BIN" -iV

          echo
          echo "Cross compiler:"
          "$CROSS_FPC" -iV

          echo
          echo "Building Booot for AArch64 Android..."

          "$FPC_BIN" \
            -Tandroid \
            -Paarch64 \
            -O3 \
            -OoREGVAR \
            -OoLOOPUNROLL \
            -Xs \
            -dBOOOT_ARM64 \
            -dANDROID \
            -Fu"$HOME/fpc/lib/fpc/3.2.0/units/aarch64-android/*" \
            -FEbuild \
            -FUbuild/units \
            -XPaarch64-linux-android- \
            -Xr \
            -k"--sysroot=$SYSROOT" \
            -Fl"$ANDROID_LIB" \
            -Fl"$ANDROID_LIB/../../../../lib" \
            -Fi"$SYSROOT/usr/include" \
            -Fu"$HOME/fpc/lib/fpc/3.2.0/units/aarch64-android" \
            -dRELEASE \
            booot7.dpr

      # ------------------------------------------------------------
      # If the wrapper FPC executable does not automatically invoke
      # the cross compiler, explicitly retry with ppcrossa64.
      # ------------------------------------------------------------
      - name: Verify and recover cross-compiler output
        run: |
          set -euxo pipefail

          if [ ! -f build/booot7 ]; then
            echo "Normal FPC invocation did not produce build/booot7."
            echo "Trying the AArch64 cross compiler directly..."

            NDK="$ANDROID_NDK_HOME"
            SYSROOT="$NDK/platforms/android-21/arch-arm64"
            ANDROID_LIB="$SYSROOT/usr/lib"

            "$CROSS_FPC" \
              -Tandroid \
              -Paarch64 \
              -O3 \
              -OoREGVAR \
              -OoLOOPUNROLL \
              -Xs \
              -dBOOOT_ARM64 \
              -dANDROID \
              -FEbuild \
              -FUbuild/units \
              -XPaarch64-linux-android- \
              -Xr \
              -k"--sysroot=$SYSROOT" \
              -Fl"$ANDROID_LIB" \
              -Fi"$SYSROOT/usr/include" \
              -dRELEASE \
              booot7.dpr
          fi

          test -f build/booot7
          test -x build/booot7

      # ------------------------------------------------------------
      # Verify executable
      # ------------------------------------------------------------
      - name: Verify executable
        run: |
          set -euxo pipefail

          echo "Built files:"
          find build -maxdepth 3 -type f -print

          echo
          echo "Executable information:"
          file build/booot7

          echo
          echo "ELF architecture:"
          readelf -h build/booot7 | \
            grep -E 'Class|Machine|Type'

          echo
          echo "Dynamic dependencies:"
          readelf -d build/booot7 | \
            grep NEEDED || true

          test "$(file -b build/booot7 | grep -c 'ELF 64-bit')" -eq 1

      # ------------------------------------------------------------
      # Prepare Android package
      # ------------------------------------------------------------
      - name: Prepare Android package
        run: |
          set -euxo pipefail

          rm -rf package
          mkdir -p package

          cp build/booot7 package/booot7

          for f in booot2.nn booot4.nn booot58.nn; do
            if [ -f "$f" ]; then
              cp "$f" package/
            else
              echo "ERROR: Required network not found: $f"
              exit 1
            fi
          done

          chmod +x package/booot7

          echo
          echo "Final package:"
          ls -lh package/

      # ------------------------------------------------------------
      # Create ZIP
      # ------------------------------------------------------------
      - name: Create ZIP
        run: |
          set -euxo pipefail

          cd package

          zip -9 -r \
            ../booot-android-arm64.zip \
            booot7 \
            booot2.nn \
            booot4.nn \
            booot58.nn

      # ------------------------------------------------------------
      # Upload artifact
      # ------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: booot-android-arm64
          path: booot-android-arm64.zip
          if-no-files-found: error
