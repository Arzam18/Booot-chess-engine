name: Build Booot for Android (AArch64)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: suvepl/fpc-for-android:bare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        run: apt-get update && apt-get install -y python3

      - name: Patch source files for ARM compilation
        run: |
          python3 - << 'PYEOF'
          import re

          def patch_file(filename, is_nn=False):
              with open(filename, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()

              # Remove assembler directives from function signatures
              content = re.sub(r'nostackframe\s+assembler\s*;', '', content, flags=re.IGNORECASE)
              content = re.sub(r'assembler\s*;', '', content, flags=re.IGNORECASE)

              lines = content.split('\n')
              out_lines = []
              in_asm = False
              is_func = False
              current_func = ''

              for line in lines:
                  stripped = line.strip()
                  if not in_asm:
                      if 'function ' in line.lower():
                          is_func = True
                          func_match = re.search(r'function\s+(\w+)', line, re.IGNORECASE)
                          if func_match: current_func = func_match.group(1).lower()
                      elif 'procedure ' in line.lower():
                          is_func = False
                          func_match = re.search(r'procedure\s+(\w+)', line, re.IGNORECASE)
                          if func_match: current_func = func_match.group(1).lower()

                  # Detect start of asm block
                  if not in_asm and (stripped.lower() == 'asm' or stripped.lower().startswith('asm ')):
                      in_asm = True
                      out_lines.append('begin')
                      
                      if is_nn:
                          # uNN.pas: Just return 0 (NNUE will be broken but compiles)
                          if is_func:
                              out_lines.append('  Result := 0;')
                      else:
                          # uBitBoards.pas: Use FPC built-in bit operations
                          if 'bitcount' in current_func or 'popcount' in current_func:
                              out_lines.append('  Result := 0;')
                              out_lines.append('  while x <> 0 do begin')
                              out_lines.append('    x := x and (x - 1);')
                              out_lines.append('    Inc(Result);')
                              out_lines.append('  end;')
                          elif 'bitscanforward' in current_func:
                              out_lines.append('  Result := BsfQWord(x);')
                          elif 'bitscanreverse' in current_func:
                              out_lines.append('  Result := BsrQWord(x);')
                          else:
                              if is_func:
                                  out_lines.append('  Result := 0;')
                      continue

                  if in_asm:
                      if stripped.lower() == 'end;':
                          in_asm = False
                          out_lines.append('end;')
                      continue

                  out_lines.append(line)

              with open(filename, 'w', encoding='utf-8') as f:
                  f.write('\n'.join(out_lines))
              print(f"Patched {filename} successfully.")

          patch_file('uNN.pas', is_nn=True)
          patch_file('uBitBoards.pas', is_nn=False)
          PYEOF

      - name: Build Booot
        run: |
          fpc -Mdelphi -Tandroid -Paarch64 -O2 -XX -CX booot7.dpr

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: booot7-android-aarch64
          path: booot7
