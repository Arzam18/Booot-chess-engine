name: Build Booot for Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - '**.pas'
      - '**.dpr'
      - '**.inc'
      - '**.rc'
      - '.github/workflows/android.yml'

jobs:
  build-android:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            curl \
            tar \
            unzip \
            file \
            binutils-aarch64-linux-gnu

      - name: Download Free Pascal AArch64 Android compiler
        run: |
          set -euxo pipefail

          FPC_URL="https://downloads.freepascal.org/fpc/snapshot/fixes/aarch64-android/fpc-3.2.3.aarch64-android.built.on.x86_64-linux.tar.gz"

          curl -L --fail --retry 3 \
            -o /tmp/fpc-aarch64-android.tar.gz \
            "$FPC_URL"

          mkdir -p "$HOME/fpc-aarch64-android"

          tar -xzf \
            /tmp/fpc-aarch64-android.tar.gz \
            -C "$HOME/fpc-aarch64-android"

      - name: Locate Free Pascal
        id: fpc
        run: |
          set -euxo pipefail

          FPC_BIN="$(find "$HOME/fpc-aarch64-android" \
            -type f \
            -name fpc \
            -perm -111 \
            | head -1)"

          test -n "$FPC_BIN"

          echo "FPC_BIN=$FPC_BIN"
          file "$FPC_BIN"

          "$FPC_BIN" -iV

          echo "FPC_BIN=$FPC_BIN" >> "$GITHUB_ENV"

      - name: Locate Android NDK
        run: |
          set -euxo pipefail

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls -la "$ANDROID_NDK_HOME"

      - name: Build Booot
        run: |
          set -euxo pipefail

          mkdir -p build

          "$FPC_BIN" \
            -Tandroid \
            -Parm \
            -O3 \
            -OoREGVAR \
            -OoLOOPUNROLL \
            -CfVFPV3 \
            -CpARMV8 \
            -dBOOOT_ARM64 \
            -Fu"$HOME/fpc-aarch64-android/lib/fpc/3.2.3/units/aarch64-android/*" \
            -FEbuild \
            booot7.dpr

      - name: Verify executable
        run: |
          set -euxo pipefail

          echo "Built files:"
          find build -maxdepth 2 -type f -print

          echo
          echo "Executable information:"
          file build/booot7

          echo
          echo "Architecture:"
          readelf -h build/booot7 | grep -E 'Class|Machine'

          test -x build/booot7

      - name: Prepare Android package
        run: |
          set -euxo pipefail

          mkdir -p package

          cp build/booot7 package/booot7

          # Copy the three NN files from the repository.
          for f in booot2.nn booot4.nn booot58.nn; do
            if [ -f "$f" ]; then
              cp "$f" package/
            else
              echo "ERROR: Required network not found: $f"
              exit 1
            fi
          done

          chmod +x package/booot7

          echo "Final package:"
          ls -lh package/

      - name: Create ZIP
        run: |
          set -euxo pipefail

          cd package
          zip -9 -r ../booot-android-arm64.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: booot-android-arm64
          path: booot-android-arm64.zip
          if-no-files-found: error
