name: Build Booot for Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - '**.pas'
      - '**.dpr'
      - '**.inc'
      - '**.rc'
      - '.github/workflows/android.yml'

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            fpc \
            fp-units-base \
            fp-units-fcl \
            fp-units-misc \
            curl \
            tar \
            unzip \
            zip \
            file \
            binutils-aarch64-linux-gnu

          echo "Native Free Pascal:"
          fpc -iV
          file "$(command -v fpc)"

      - name: Locate Android NDK
        run: |
          set -euxo pipefail

          SDK_ROOT="/usr/local/lib/android/sdk"

          echo "Android SDK:"
          ls -la "$SDK_ROOT"

          echo
          echo "Installed NDK versions:"

          find "$SDK_ROOT/ndk" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -print \
            2>/dev/null || true

          NDK_DIR="$(find "$SDK_ROOT/ndk" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -1)"

          if [ -z "$NDK_DIR" ]; then
            echo "ERROR: Android NDK was not found."
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

          echo
          echo "Using NDK:"
          echo "$NDK_DIR"

      - name: Download Free Pascal AArch64 Android cross compiler
        run: |
          set -euxo pipefail

          CROSS_URL="https://downloads.freepascal.org/fpc/dist/3.2.2/x86_64-linux/fpc-3.2.2-aarch64-android.cross.x86_64-linux.tar"

          curl -L \
            --fail \
            --retry 3 \
            -o /tmp/fpc-aarch64-cross.tar \
            "$CROSS_URL"

          mkdir -p "$HOME/fpc-aarch64-cross"

          tar -xf \
            /tmp/fpc-aarch64-cross.tar \
            -C "$HOME/fpc-aarch64-cross"

      - name: Locate AArch64 cross compiler
        run: |
          set -euxo pipefail

          CROSS_FPC="$(find "$HOME/fpc-aarch64-cross" \
            -type f \
            -name ppcrossa64 \
            -perm -111 \
            | head -1)"

          if [ -z "$CROSS_FPC" ]; then
            echo "ERROR: ppcrossa64 not found."

            find "$HOME/fpc-aarch64-cross" \
              -maxdepth 7 \
              -type f \
              | head -200

            exit 1
          fi

          echo "CROSS_FPC=$CROSS_FPC" >> "$GITHUB_ENV"

          echo "Cross compiler:"
          file "$CROSS_FPC"

      - name: Locate AArch64 Android RTL
        run: |
          set -euxo pipefail

          RTL_DIR="$(find "$HOME/fpc-aarch64-cross" \
            -type d \
            -path '*aarch64-android*' \
            | grep '/units/aarch64-android$' \
            | head -1)"

          if [ -z "$RTL_DIR" ]; then
            echo "ERROR: AArch64 Android RTL not found."

            find "$HOME/fpc-aarch64-cross" \
              -type d \
              | grep -E 'aarch64|android' \
              | head -200

            exit 1
          fi

          echo "RTL_DIR=$RTL_DIR" >> "$GITHUB_ENV"

          echo "RTL:"
          echo "$RTL_DIR"

      - name: Locate Android linker
        run: |
          set -euxo pipefail

          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"

          test -d "$TOOLCHAIN"

          AARCH64_CLANG="$TOOLCHAIN/bin/aarch64-linux-android24-clang"

          test -x "$AARCH64_CLANG"

          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

          echo "Android AArch64 compiler:"
          "$AARCH64_CLANG" --version

      - name: Build Booot
        run: |
          set -euxo pipefail

          mkdir -p build

          echo "Free Pascal:"
          fpc -iV

          echo
          echo "Cross compiler:"
          file "$CROSS_FPC"

          echo
          echo "Building Booot..."

          "$CROSS_FPC" \
            -Tandroid \
            -O3 \
            -OoREGVAR \
            -OoLOOPUNROLL \
            -dBOOOT_ARM64 \
            -Fu"$RTL_DIR" \
            -FEbuild \
            booot7.dpr

      - name: Verify executable
        run: |
          set -euxo pipefail

          echo "Built files:"
          find build -maxdepth 2 -type f -print

          BOOOT_BIN="$(find build \
            -maxdepth 2 \
            -type f \
            -perm -111 \
            | head -1)"

          if [ -z "$BOOOT_BIN" ]; then
            echo "ERROR: Booot executable not found."
            exit 1
          fi

          echo "BOOOT_BIN=$BOOOT_BIN" >> "$GITHUB_ENV"

          echo
          echo "Executable:"
          file "$BOOOT_BIN"

          echo
          echo "ELF architecture:"
          readelf -h "$BOOOT_BIN" |
            grep -E 'Class|Machine|OS/ABI'

          test -x "$BOOOT_BIN"

      - name: Check neural networks
        run: |
          set -euxo pipefail

          for f in \
            booot2.nn \
            booot4.nn \
            booot58.nn
          do
            if [ ! -f "$f" ]; then
              echo "ERROR: Required network not found: $f"
              exit 1
            fi

            echo "$f:"
            ls -lh "$f"
          done

      - name: Prepare Android package
        run: |
          set -euxo pipefail

          rm -rf package
          mkdir -p package

          cp "$BOOOT_BIN" package/booot7
          cp booot2.nn package/
          cp booot4.nn package/
          cp booot58.nn package/

          chmod +x package/booot7

          echo "Final package:"
          ls -lh package/

      - name: Create ZIP
        run: |
          set -euxo pipefail

          cd package

          zip -9 \
            -r \
            ../booot-android-arm64.zip \
            .

          cd ..

          ls -lh booot-android-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: booot-android-arm64
          path: booot-android-arm64.zip
          if-no-files-found: error
