name: Build Booot for Android ARM64

on:
  workflow_dispatch:

  push:
    paths:
      - "*.pas"
      - "*.dpr"
      - "*.inc"
      - "*.rc"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            tar \
            unzip \
            zip \
            file \
            binutils-aarch64-linux-gnu


      # ============================================================
      # INSTALL HOST FREE PASCAL 3.2.0
      # ============================================================
      - name: Install Free Pascal 3.2.0 host compiler
        run: |
          set -e

          cd "$HOME"

          curl -L -o fpc-3.2.0-x86_64-linux.tar \
            https://downloads.freepascal.org/fpc/dist/3.2.0/x86_64-linux/fpc-3.2.0-x86_64-linux.tar

          mkdir -p "$HOME/fpc-host"

          tar -xf fpc-3.2.0-x86_64-linux.tar \
            -C "$HOME/fpc-host"

          cd "$HOME/fpc-host"

          INSTALLER=$(find . -type f -name install.sh | head -n 1)

          if [ -z "$INSTALLER" ]; then
            echo "ERROR: Host FPC install.sh not found."
            exit 1
          fi

          echo "Using host installer: $INSTALLER"

          cd "$(dirname "$INSTALLER")"

          sudo ./install.sh \
            -D \
            "$HOME/fpc-install"

          echo "$HOME/fpc-install/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/fpc-install/bin:$PATH"

          echo
          echo "Host FPC:"
          fpc -iV

          echo
          echo "Host FPC location:"
          command -v fpc


      # ============================================================
      # INSTALL AARCH64 ANDROID CROSS COMPILER
      # ============================================================
      - name: Install Free Pascal AArch64 Android cross compiler
        run: |
          set -e

          cd "$HOME"

          curl -L -o fpc-3.2.0-aarch64-android.cross.x86_64-linux.tar \
            https://downloads.freepascal.org/fpc/dist/3.2.0/x86_64-linux/fpc-3.2.0-aarch64-android.cross.x86_64-linux.tar

          mkdir -p "$HOME/fpc-cross"

          tar -xf fpc-3.2.0-aarch64-android.cross.x86_64-linux.tar \
            -C "$HOME/fpc-cross"

          cd "$HOME/fpc-cross"

          INSTALLER=$(find . -type f -name install.sh | head -n 1)

          if [ -z "$INSTALLER" ]; then
            echo "ERROR: Cross FPC install.sh not found."
            exit 1
          fi

          echo "Using cross installer: $INSTALLER"

          cd "$(dirname "$INSTALLER")"

          export PATH="$HOME/fpc-install/bin:$PATH"

          echo
          echo "Host FPC available to cross installer:"
          command -v fpc
          fpc -iV

          echo
          echo "Installing AArch64 Android cross compiler..."

          printf '%s\n' "$HOME/fpc-install" | ./install.sh

          CROSS_BIN="$HOME/fpc-install/bin/x86_64-linux"

          if [ ! -x "$CROSS_BIN/ppcrossa64" ]; then
            echo
            echo "ERROR: ppcrossa64 was not installed in expected location."

            echo
            echo "Searching fpc-install:"
            find "$HOME/fpc-install" \
              -type f \
              -name "ppcrossa64" \
              -print

            echo
            echo "Searching system installation:"
            find /usr \
              -type f \
              -name "ppcrossa64" \
              -print 2>/dev/null \
              | sed -n '1,50p'

            exit 1
          fi

          echo "$CROSS_BIN" >> "$GITHUB_PATH"
          echo "$HOME/fpc-install/bin" >> "$GITHUB_PATH"

          export PATH="$CROSS_BIN:$HOME/fpc-install/bin:$PATH"

          echo
          echo "AArch64 cross compiler:"
          command -v ppcrossa64

          echo
          ppcrossa64 -iV

          echo
          echo "Cross compiler:"
          ls -lh "$CROSS_BIN/ppcrossa64"


      # ============================================================
      # INSTALL COMPLETE AARCH64 ANDROID FPC PACKAGE
      #
      # IMPORTANT:
      # This package contains the Android target RTL.
      # We DO NOT execute its Android compiler on Ubuntu.
      #
      # The package is installed into a separate prefix and the
      # AArch64 Android RTL is then copied into the cross compiler's
      # target unit directory.
      # ============================================================
      - name: Install AArch64 Android RTL
        run: |
          set -e

          cd "$HOME"

          FULL_FPC="$HOME/fpc-android-full"
          FULL_INSTALL="$HOME/fpc-android-install"

          rm -rf "$FULL_FPC"
          rm -rf "$FULL_INSTALL"

          mkdir -p "$FULL_FPC"
          mkdir -p "$FULL_INSTALL"

          curl -L -o fpc-3.2.0-aarch64-android.built-on-x86_64-linux.tar \
            https://downloads.freepascal.org/fpc/dist/3.2.0/aarch64-android/fpc-3.2.0-aarch64-android.built-on-x86_64-linux.tar

          tar -xf fpc-3.2.0-aarch64-android.built-on-x86_64-linux.tar \
            -C "$FULL_FPC"

          echo
          echo "Complete Android FPC package:"
          find "$FULL_FPC" -maxdepth 3 -type f | sed -n '1,80p'

          INSTALLER=$(find "$FULL_FPC" -type f -name install.sh | head -n 1)

          if [ -z "$INSTALLER" ]; then
            echo "ERROR: Android FPC install.sh not found."

            echo
            echo "Archive contents:"
            find "$FULL_FPC" -maxdepth 5 -print | sed -n '1,200p'

            exit 1
          fi

          echo
          echo "Android FPC installer:"
          echo "$INSTALLER"

          chmod +x "$INSTALLER"

          cd "$(dirname "$INSTALLER")"

          ./install.sh \
            -D \
            "$FULL_INSTALL"

          echo
          echo "Searching installed Android FPC package for system.ppu..."

          SYSTEM_PPU=$(find "$FULL_INSTALL" \
            -type f \
            -path '*aarch64-android*' \
            -name 'system.ppu' \
            -print \
            | sed -n '1p')

          if [ -z "$SYSTEM_PPU" ]; then
            echo "ERROR: system.ppu was not found after installing the complete AArch64 Android FPC package."

            echo
            echo "All system.ppu files:"
            find "$FULL_INSTALL" \
              -type f \
              -name 'system.ppu' \
              -print \
              | sed -n '1,100p'

            echo
            echo "Installed FPC directory:"
            find "$FULL_INSTALL" \
              -maxdepth 5 \
              -type d \
              | sed -n '1,200p'

            exit 1
          fi

          echo
          echo "Found target RTL:"
          echo "$SYSTEM_PPU"

          RTL_DIR=$(dirname "$SYSTEM_PPU")

          echo
          echo "Target RTL directory:"
          echo "$RTL_DIR"

          TARGET_UNITS="$HOME/fpc-install/lib/fpc/3.2.0/units/aarch64-android"

          rm -rf "$TARGET_UNITS"

          mkdir -p "$TARGET_UNITS"

          cp -a "$RTL_DIR"/. "$TARGET_UNITS"/

          echo
          echo "Installed target RTL:"
          find "$TARGET_UNITS" \
            -maxdepth 2 \
            -type f \
            | sed -n '1,120p'

          echo
          echo "Checking system.ppu..."

          if [ ! -f "$TARGET_UNITS/system.ppu" ]; then
            echo "ERROR: system.ppu was not copied correctly."
            exit 1
          fi

          echo
          echo "SUCCESS: AArch64 Android RTL installed."

          ls -lh "$TARGET_UNITS/system.ppu"


      # ============================================================
      # INSTALL ANDROID NDK r20
      # ============================================================
      - name: Install Android NDK r20
        run: |
          set -e

          cd "$HOME"

          curl -L -o android-ndk-r20-linux-x86_64.zip \
            https://dl.google.com/android/repository/android-ndk-r20-linux-x86_64.zip

          rm -rf "$HOME/android-ndk-r20"

          unzip -q android-ndk-r20-linux-x86_64.zip \
            -d "$HOME"

          mv "$HOME/android-ndk-r20" "$HOME/android-ndk-r20"

          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r20" >> "$GITHUB_ENV"

          echo
          echo "Android NDK:"
          "$HOME/android-ndk-r20/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" \
            --version


      # ============================================================
      # CONFIGURE ANDROID TOOLCHAIN
      # ============================================================
      - name: Configure Android AArch64 toolchain
        run: |
          set -e

          NDK="$HOME/android-ndk-r20"

          TOOLCHAIN_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          if [ ! -d "$TOOLCHAIN_BIN" ]; then
            echo "ERROR: Android NDK toolchain directory not found:"
            echo "$TOOLCHAIN_BIN"
            exit 1
          fi

          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

          export PATH="$TOOLCHAIN_BIN:$PATH"

          echo
          echo "Android toolchain:"
          echo "$TOOLCHAIN_BIN"

          echo
          echo "Checking AArch64 Android tools..."

          command -v aarch64-linux-android-as
          command -v aarch64-linux-android-ld
          command -v aarch64-linux-android-ar
          command -v aarch64-linux-android-strip

          echo
          echo "AArch64 Android assembler:"
          aarch64-linux-android-as --version | head -n 1


      # ============================================================
      # VERIFY FPC CROSS COMPILER + RTL
      # ============================================================
      - name: Verify Free Pascal Android target
        run: |
          set -e

          export PATH="$HOME/fpc-install/bin/x86_64-linux:$HOME/fpc-install/bin:$PATH"

          CROSS_COMPILER="$HOME/fpc-install/bin/x86_64-linux/ppcrossa64"

          if [ ! -x "$CROSS_COMPILER" ]; then
            echo "ERROR: AArch64 cross compiler not found:"
            echo "$CROSS_COMPILER"
            exit 1
          fi

          TARGET_UNITS="$HOME/fpc-install/lib/fpc/3.2.0/units/aarch64-android"

          if [ ! -f "$TARGET_UNITS/system.ppu" ]; then
            echo "ERROR: Target RTL system.ppu is missing:"
            echo "$TARGET_UNITS/system.ppu"
            exit 1
          fi

          echo
          echo "Cross compiler:"
          "$CROSS_COMPILER" -iV

          echo
          echo "Target RTL:"
          ls -lh "$TARGET_UNITS/system.ppu"

          echo
          echo "FPC executable:"
          file "$CROSS_COMPILER"

          echo
          echo "RTL directory:"
          find "$TARGET_UNITS" \
            -maxdepth 2 \
            -type f \
            | sed -n '1,100p'


      # ============================================================
      # BUILD BOOOT
      # ============================================================
      - name: Build Booot
        run: |
          set -e

          export PATH="$HOME/fpc-install/bin/x86_64-linux:$HOME/fpc-install/bin:$PATH"

          CROSS_COMPILER="$HOME/fpc-install/bin/x86_64-linux/ppcrossa64"

          TARGET_UNITS="$HOME/fpc-install/lib/fpc/3.2.0/units/aarch64-android"

          echo
          echo "Building Booot for Android AArch64..."

          "$CROSS_COMPILER" \
            -Tandroid \
            -Parm64 \
            -O3 \
            -OoREGVAR \
            -OoUNCERTAIN \
            -Fu"$TARGET_UNITS" \
            -Fu"$TARGET_UNITS/rtl" \
            booot7.dpr

          echo
          echo "Build finished."

          echo
          echo "Generated files:"
          ls -lah


      # ============================================================
      # FIND BOOOT BINARY
      # ============================================================
      - name: Verify Booot binary
        run: |
          set -e

          echo
          echo "Searching for Booot executable..."

          BOOOT_BIN=$(find . \
            -maxdepth 3 \
            -type f \
            -perm -111 \
            ! -path './.git/*' \
            | head -n 1)

          if [ -z "$BOOOT_BIN" ]; then
            echo "ERROR: Booot executable was not produced."
            exit 1
          fi

          echo
          echo "Booot binary:"
          echo "$BOOOT_BIN"

          file "$BOOOT_BIN"

          echo
          echo "Binary size:"
          ls -lh "$BOOOT_BIN"

          if ! file "$BOOOT_BIN" | grep -qi "ARM aarch64"; then
            echo "ERROR: Binary is not AArch64."
            exit 1
          fi

          mv "$BOOOT_BIN" booot7-android-arm64

          chmod +x booot7-android-arm64

          echo
          echo "Final binary:"
          file booot7-android-arm64
          ls -lh booot7-android-arm64


      # ============================================================
      # VERIFY NEURAL NETWORK FILES
      #
      # These are intentionally expected to already exist in the
      # user's repository.
      # ============================================================
      - name: Verify Booot neural network files
        run: |
          set -e

          echo
          echo "Checking Booot neural network files..."

          for NN in booot2.nn booot4.nn booot58.nn; do
            if [ ! -f "$NN" ]; then
              echo "ERROR: Missing neural network file:"
              echo "$NN"
              exit 1
            fi

            echo
            echo "$NN:"
            ls -lh "$NN"
            file "$NN"
          done

          echo
          echo "All Booot neural network files are present."


      # ============================================================
      # CREATE ANDROID ENGINE PACKAGE
      # ============================================================
      - name: Package Booot Android ARM64
        run: |
          set -e

          mkdir -p booot-android-arm64

          cp booot7-android-arm64 \
            booot-android-arm64/

          cp booot2.nn \
            booot-android-arm64/

          cp booot4.nn \
            booot-android-arm64/

          cp booot58.nn \
            booot-android-arm64/

          chmod +x \
            booot-android-arm64/booot7-android-arm64

          echo
          echo "Android package:"
          ls -lah booot-android-arm64

          echo
          echo "Creating ZIP..."

          zip -r booot-android-arm64.zip \
            booot-android-arm64/

          echo
          echo "Final ZIP:"
          ls -lh booot-android-arm64.zip


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload Booot Android ARM64
        uses: actions/upload-artifact@v4
        with:
          name: booot-android-arm64
          path: booot-android-arm64.zip
          if-no-files-found: error
