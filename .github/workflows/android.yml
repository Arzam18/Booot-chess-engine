name: Build Booot for Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - '**.pas'
      - '**.dpr'
      - '**.inc'
      - '**.rc'
      - '.github/workflows/android.yml'

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Install basic dependencies
      # ----------------------------------------------------------
      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            tar \
            unzip \
            file \
            binutils-aarch64-linux-gnu


      # ----------------------------------------------------------
      # Locate Android NDK already installed on GitHub runner
      # ----------------------------------------------------------
      - name: Locate Android NDK
        run: |
          set -euxo pipefail

          SDK_ROOT="/usr/local/lib/android/sdk"

          echo "Android SDK:"
          ls -la "$SDK_ROOT"

          echo
          echo "Installed NDK versions:"
          find "$SDK_ROOT/ndk" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -print \
            2>/dev/null || true

          NDK_DIR="$(find "$SDK_ROOT/ndk" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -1)"

          if [ -z "$NDK_DIR" ]; then
            echo "ERROR: Android NDK was not found on the runner."
            exit 1
          fi

          echo "Using NDK:"
          echo "$NDK_DIR"

          test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"


      # ----------------------------------------------------------
      # Download native x86-64 Linux Free Pascal
      #
      # This compiler RUNS on Ubuntu x86-64.
      # ----------------------------------------------------------
      - name: Download native Free Pascal
        run: |
          set -euxo pipefail

          FPC_HOST_URL="https://downloads.freepascal.org/fpc/dist/3.2.2/x86_64-linux/fpc-3.2.2-x86_64-linux.tar"

          curl -L \
            --fail \
            --retry 3 \
            -o /tmp/fpc-host.tar \
            "$FPC_HOST_URL"

          mkdir -p "$HOME/fpc-host"

          tar -xf \
            /tmp/fpc-host.tar \
            -C "$HOME/fpc-host"


      # ----------------------------------------------------------
      # Locate native FPC
      # ----------------------------------------------------------
      - name: Locate native Free Pascal
        run: |
          set -euxo pipefail

          HOST_FPC="$(find "$HOME/fpc-host" \
            -type f \
            -name fpc \
            -perm -111 \
            | head -1)"

          if [ -z "$HOST_FPC" ]; then
            echo "ERROR: Native FPC compiler not found."

            find "$HOME/fpc-host" \
              -maxdepth 6 \
              -type f \
              | head -200

            exit 1
          fi

          echo "HOST_FPC=$HOST_FPC"

          file "$HOST_FPC"

          "$HOST_FPC" -iV

          echo "HOST_FPC=$HOST_FPC" >> "$GITHUB_ENV"


      # ----------------------------------------------------------
      # Download Linux -> Android AArch64 cross compiler
      #
      # IMPORTANT:
      # This is NOT the aarch64-android native Android compiler.
      #
      # This compiler RUNS on x86-64 Linux and produces
      # AArch64 Android binaries.
      # ----------------------------------------------------------
      - name: Download Free Pascal AArch64 Android cross compiler
        run: |
          set -euxo pipefail

          FPC_CROSS_URL="https://downloads.freepascal.org/fpc/dist/3.2.2/x86_64-linux/fpc-3.2.2-aarch64-android.cross.x86_64-linux.tar"

          curl -L \
            --fail \
            --retry 3 \
            -o /tmp/fpc-aarch64-cross.tar \
            "$FPC_CROSS_URL"

          mkdir -p "$HOME/fpc-aarch64-cross"

          tar -xf \
            /tmp/fpc-aarch64-cross.tar \
            -C "$HOME/fpc-aarch64-cross"


      # ----------------------------------------------------------
      # Locate ppcrossa64
      # ----------------------------------------------------------
      - name: Locate AArch64 cross compiler
        run: |
          set -euxo pipefail

          CROSS_FPC="$(find "$HOME/fpc-aarch64-cross" \
            -type f \
            -name ppcrossa64 \
            -perm -111 \
            | head -1)"

          if [ -z "$CROSS_FPC" ]; then
            echo "ERROR: ppcrossa64 was not found."

            find "$HOME/fpc-aarch64-cross" \
              -maxdepth 7 \
              -type f \
              | head -300

            exit 1
          fi

          echo "CROSS_FPC=$CROSS_FPC"

          file "$CROSS_FPC"

          "$CROSS_FPC" -iV || true

          echo "CROSS_FPC=$CROSS_FPC" >> "$GITHUB_ENV"


      # ----------------------------------------------------------
      # Find AArch64 Android Free Pascal units
      # ----------------------------------------------------------
      - name: Locate AArch64 Android RTL
        run: |
          set -euxo pipefail

          RTL_DIR="$(find "$HOME/fpc-aarch64-cross" \
            -type d \
            -path '*aarch64-android*' \
            | grep '/units/aarch64-android$' \
            | head -1)"

          if [ -z "$RTL_DIR" ]; then
            echo "ERROR: AArch64 Android RTL units not found."

            find "$HOME/fpc-aarch64-cross" \
              -type d \
              | grep -E 'aarch64|android' \
              | head -100

            exit 1
          fi

          echo "RTL_DIR=$RTL_DIR"

          echo "RTL_DIR=$RTL_DIR" >> "$GITHUB_ENV"


      # ----------------------------------------------------------
      # Find Free Pascal cross binutils
      # ----------------------------------------------------------
      - name: Prepare Android linker
        run: |
          set -euxo pipefail

          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"

          test -d "$TOOLCHAIN"

          AARCH64_CLANG="$TOOLCHAIN/bin/aarch64-linux-android24-clang"

          test -x "$AARCH64_CLANG"

          echo "Android AArch64 compiler:"
          "$AARCH64_CLANG" --version

          echo
          echo "Android AArch64 linker:"
          ls -l "$TOOLCHAIN/bin/ld.lld"

          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"


      # ----------------------------------------------------------
      # Build Booot
      # ----------------------------------------------------------
      - name: Build Booot
        run: |
          set -euxo pipefail

          mkdir -p build

          echo "Host FPC:"
          "$HOST_FPC" -iV

          echo
          echo "Cross compiler:"
          file "$CROSS_FPC"

          echo
          echo "RTL:"
          echo "$RTL_DIR"

          echo
          echo "Building Booot..."

          "$CROSS_FPC" \
            -Tandroid \
            -Paarch64 \
            -O3 \
            -OoREGVAR \
            -OoLOOPUNROLL \
            -dBOOOT_ARM64 \
            -Xc \
            -Xd \
            -Xr \
            -XP"$TOOLCHAIN/bin/aarch64-linux-android-" \
            -Fu"$RTL_DIR" \
            -FEbuild \
            booot7.dpr


      # ----------------------------------------------------------
      # Verify executable
      # ----------------------------------------------------------
      - name: Verify executable
        run: |
          set -euxo pipefail

          echo "Built files:"
          find build \
            -maxdepth 2 \
            -type f \
            -print

          echo
          echo "Executable information:"

          BOOOT_BIN="$(find build \
            -maxdepth 2 \
            -type f \
            -perm -111 \
            | head -1)"

          if [ -z "$BOOOT_BIN" ]; then
            echo "ERROR: Booot executable was not found."
            exit 1
          fi

          echo "BOOOT_BIN=$BOOOT_BIN"

          file "$BOOOT_BIN"

          echo
          echo "Architecture:"

          readelf -h "$BOOOT_BIN" \
            | grep -E 'Class|Machine|OS/ABI'

          echo
          echo "Dynamic dependencies:"

          readelf -d "$BOOOT_BIN" \
            | grep NEEDED || true

          test -x "$BOOOT_BIN"

          echo "BOOOT_BIN=$BOOOT_BIN" >> "$GITHUB_ENV"


      # ----------------------------------------------------------
      # Check the three neural networks
      # ----------------------------------------------------------
      - name: Check neural networks
        run: |
          set -euxo pipefail

          for f in \
            booot2.nn \
            booot4.nn \
            booot58.nn
          do
            if [ ! -f "$f" ]; then
              echo "ERROR: Required network not found: $f"
              exit 1
            fi

            echo
            echo "$f:"
            ls -lh "$f"
          done


      # ----------------------------------------------------------
      # Prepare Android package
      # ----------------------------------------------------------
      - name: Prepare Android package
        run: |
          set -euxo pipefail

          rm -rf package

          mkdir -p package

          cp "$BOOOT_BIN" \
            package/booot7

          cp booot2.nn \
            package/

          cp booot4.nn \
            package/

          cp booot58.nn \
            package/

          chmod +x package/booot7

          echo
          echo "Final package:"

          ls -lh package/


      # ----------------------------------------------------------
      # Create ZIP
      # ----------------------------------------------------------
      - name: Create ZIP
        run: |
          set -euxo pipefail

          cd package

          zip -9 \
            -r \
            ../booot-android-arm64.zip \
            .

          cd ..

          echo
          echo "Created:"
          ls -lh booot-android-arm64.zip


      # ----------------------------------------------------------
      # Upload artifact
      # ----------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: booot-android-arm64
          path: booot-android-arm64.zip
          if-no-files-found: error
