name: Booot Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Install Android NDK r20
      # ------------------------------------------------------------
      - name: Install Android NDK r20
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/android-sdk"

          curl -L \
            -o "$HOME/android-sdk/commandlinetools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          mkdir -p "$HOME/android-sdk/cmdline-tools"

          unzip -q \
            "$HOME/android-sdk/commandlinetools.zip" \
            -d "$HOME/android-sdk/cmdline-tools"

          mv \
            "$HOME/android-sdk/cmdline-tools/cmdline-tools" \
            "$HOME/android-sdk/cmdline-tools/latest"

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-21" \
            "ndk;20.1.5948944"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/20.1.5948944" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      # ------------------------------------------------------------
      # Install Free Pascal 3.2.0 native compiler
      # ------------------------------------------------------------
      - name: Install Free Pascal 3.2.0
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/fpc"
          cd "$HOME/fpc"

          curl -L \
            -o fpc-host.tar \
            https://sourceforge.net/projects/freepascal/files/Linux/3.2.0/fpc-3.2.0-x86_64-linux.tar/download

          tar -xf fpc-host.tar

          cd fpc-3.2.0.x86_64-linux

          sudo ./install.sh <<EOF
          $HOME/fpc-install
          n
          n
          n
          n
          n
          n
          EOF

          echo "$HOME/fpc-install/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------
      # Install Free Pascal AArch64 Android cross compiler
      # ------------------------------------------------------------
      - name: Install FPC AArch64 Android cross compiler
        run: |
          set -euxo pipefail

          cd "$HOME/fpc"

          curl -L \
            -o fpc-cross.tar \
            https://sourceforge.net/projects/freepascal/files/Linux/3.2.0/fpc-3.2.0-aarch64-android.cross.x86_64-linux.tar/download

          tar -xf fpc-cross.tar

          cd fpc-3.2.0.aarch64-android.cross.x86_64-linux

          sudo ./install.sh <<EOF
          $HOME/fpc-install
          n
          n
          n
          n
          n
          EOF

      # ------------------------------------------------------------
      # Verify the installed compilers
      # ------------------------------------------------------------
      - name: Verify AArch64 cross compiler
        run: |
          set -euxo pipefail

          export PATH="$HOME/fpc-install/bin:$HOME/fpc-install/bin/x86_64-linux:$PATH"

          CROSS_COMPILER="$HOME/fpc-install/bin/x86_64-linux/ppcrossa64"

          test -x "$CROSS_COMPILER"

          echo "===== FPC ====="
          command -v fpc
          fpc -iV

          echo "===== AArch64 cross compiler ====="
          echo "CROSS_COMPILER=$CROSS_COMPILER"
          ls -lh "$CROSS_COMPILER"
          file "$CROSS_COMPILER"

          "$CROSS_COMPILER" -iV

          echo "===== Target ====="
          "$CROSS_COMPILER" -iTP
          "$CROSS_COMPILER" -iTO

          echo "CROSS_COMPILER=$CROSS_COMPILER" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Put ppcrossa64 directly on PATH
      # ------------------------------------------------------------
      - name: Configure Free Pascal cross compiler
        run: |
          set -euxo pipefail

          echo "$HOME/fpc-install/bin/x86_64-linux" >> "$GITHUB_PATH"

          export PATH="$HOME/fpc-install/bin/x86_64-linux:$HOME/fpc-install/bin:$PATH"

          echo "===== Compiler commands ====="
          command -v fpc
          command -v ppcrossa64

          fpc -iV
          ppcrossa64 -iV

      # ------------------------------------------------------------
      # Check Android NDK
      # ------------------------------------------------------------
      - name: Verify Android NDK
        run: |
          set -euxo pipefail

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          test -d "$ANDROID_NDK_HOME"

          SYSROOT="$ANDROID_NDK_HOME/platforms/android-21/arch-arm64"

          test -d "$SYSROOT"

          echo "===== NDK ====="
          ls -ld "$ANDROID_NDK_HOME"

          echo "===== ARM64 sysroot ====="
          ls -ld "$SYSROOT"

          echo "===== Android compiler ====="
          ls -lh \
            "$ANDROID_NDK_HOME/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin/" \
            | head -20

      # ------------------------------------------------------------
      # Build Booot
      # ------------------------------------------------------------
      - name: Build Booot
        run: |
          set -euxo pipefail

          export PATH="$HOME/fpc-install/bin/x86_64-linux:$HOME/fpc-install/bin:$PATH"

          mkdir -p build
          mkdir -p build/units

          NDK="$ANDROID_NDK_HOME"
          SYSROOT="$NDK/platforms/android-21/arch-arm64"
          ANDROID_LIB="$SYSROOT/usr/lib"

          echo "======================================"
          echo "Building Booot for Android AArch64"
          echo "======================================"

          echo "FPC:"
          fpc -iV

          echo "Cross compiler:"
          ppcrossa64 -iV

          echo "Sysroot:"
          echo "$SYSROOT"

          fpc \
            -Tandroid \
            -Paarch64 \
            -O3 \
            -OoREGVAR \
            -OoLOOPUNROLL \
            -Xs \
            -dBOOOT_ARM64 \
            -dANDROID \
            -dRELEASE \
            -FEbuild \
            -FUbuild/units \
            -Fu"$HOME/fpc-install/lib/fpc/3.2.0/units/aarch64-android/*" \
            -XPaarch64-linux-android- \
            -k"--sysroot=$SYSROOT" \
            -Fl"$ANDROID_LIB" \
            -Fi"$SYSROOT/usr/include" \
            booot7.dpr

      # ------------------------------------------------------------
      # Locate and inspect binary
      # ------------------------------------------------------------
      - name: Inspect Booot binary
        run: |
          set -euxo pipefail

          echo "===== Build directory ====="
          find build -maxdepth 3 -type f -exec ls -lh {} \;

          BINARY="$(find build -maxdepth 1 -type f -perm -111 | head -n 1)"

          if [ -z "$BINARY" ]; then
            echo "ERROR: Booot binary was not found."
            exit 1
          fi

          echo "BINARY=$BINARY"

          file "$BINARY"
          ls -lh "$BINARY"

          cp "$BINARY" build/Booot-android-arm64

          echo "===== Final binary ====="
          file build/Booot-android-arm64
          ls -lh build/Booot-android-arm64

      # ------------------------------------------------------------
      # Basic UCI test
      # ------------------------------------------------------------
      - name: UCI test
        run: |
          set -euxo pipefail

          BINARY="./build/Booot-android-arm64"

          if command -v qemu-aarch64 >/dev/null 2>&1; then
            printf 'uci\nisready\nquit\n' | timeout 30 qemu-aarch64 "$BINARY" || true
          else
            echo "qemu-aarch64 is not installed on this runner."
            echo "Skipping host-side execution test."
          fi

      # ------------------------------------------------------------
      # Package only the engine binary
      # ------------------------------------------------------------
      - name: Prepare artifact
        run: |
          set -euxo pipefail

          mkdir -p artifact

          cp build/Booot-android-arm64 artifact/Booot-android-arm64

          chmod +x artifact/Booot-android-arm64

          echo "===== Artifact ====="
          file artifact/Booot-android-arm64
          ls -lh artifact/Booot-android-arm64

      # ------------------------------------------------------------
      # Upload Android engine
      # ------------------------------------------------------------
      - name: Upload Booot Android ARM64
        uses: actions/upload-artifact@v4
        with:
          name: Booot-android-arm64
          path: artifact/Booot-android-arm64
          if-no-files-found: error
