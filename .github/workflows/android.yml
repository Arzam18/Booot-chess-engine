name: Build Booot for Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    paths:
      - '**.pas'
      - '**.dpr'
      - '**.lpi'
      - '**.dproj'
      - '.github/workflows/android.yml'
      - 'booot2.nn'
      - 'booot4.nn'
      - 'booot58.nn'

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            for d in /usr/local/lib/android/sdk/ndk/*; do
              if [ -d "$d" ]; then NDK="$d"; fi
            done
          fi
          test -n "$NDK"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "NDK=$NDK"

      - name: Download Free Pascal AArch64 Android compiler
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/fpc-aarch64-android.tar.gz \
            https://downloads.freepascal.org/fpc/snapshot/fixes/aarch64-android/fpc-3.2.3.aarch64-android.built.on.x86_64-linux.tar.gz
          mkdir -p "$HOME/fpc-aarch64-android"
          tar -xzf /tmp/fpc-aarch64-android.tar.gz -C "$HOME/fpc-aarch64-android"
          FPC_BIN="$(find "$HOME/fpc-aarch64-android" -type f -name fpc -perm -111 | head -1)"
          test -n "$FPC_BIN"
          echo "FPC_BIN=$FPC_BIN" >> "$GITHUB_ENV"
          "$FPC_BIN" -iV
          "$FPC_BIN" -iTP
          "$FPC_BIN" -iTO

      - name: Check neural networks
        shell: bash
        run: |
          set -euxo pipefail
          for f in booot2.nn booot4.nn booot58.nn; do
            test -f "$f"
            test -s "$f"
            echo "$f: $(stat -c%s "$f") bytes"
          done

      - name: Build Booot
        shell: bash
        run: |
          set -euxo pipefail
          SYSROOT="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          CLANG="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          LIBDIR="$SYSROOT/usr/lib/aarch64-linux-android/24"

          rm -rf build
          mkdir -p build

          "$FPC_BIN" \
            -Mdelphi \
            -Rintel \
            -Tandroid \
            -Paarch64 \
            -dBOOOT_ARM64 \
            -O3 \
            -OoREGVAR \
            -OoPEEPHOLE \
            -Xs \
            -k"--sysroot=$SYSROOT" \
            -k"-fuse-ld=lld" \
            -Fl"$LIBDIR" \
            -Fu. \
            -FEbuild \
            -FUbuild/units \
            booot7.dpr

          file build/booot7
          readelf -h build/booot7 | grep -E 'Class:|Machine:|Type:'
          chmod +x build/booot7

          # Basic non-interactive UCI smoke test. The engine needs the three NN files.
          timeout 8s bash -c 'printf "uci\\nisready\\nquit\\n" | ./build/booot7' > build/uci.txt 2>&1 || true
          cat build/uci.txt
          grep -q '^uciok' build/uci.txt
          grep -q '^readyok' build/uci.txt

      - name: Package Android engine
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release
          cp build/booot7 release/Booot-android-arm64
          cp booot2.nn booot4.nn booot58.nn release/
          chmod +x release/Booot-android-arm64
          (
            cd release
            zip -9 -q Booot-android-arm64.zip Booot-android-arm64 booot2.nn booot4.nn booot58.nn
          )
          # Keep the artifact as one zip; it contains the executable and its three required NN files.
          ls -lh release/Booot-android-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Booot-android-arm64
          path: release/Booot-android-arm64.zip
          if-no-files-found: error
