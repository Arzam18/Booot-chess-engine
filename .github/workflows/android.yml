name: Build Booot for Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - '**.pas'
      - '**.dpr'
      - '**.inc'
      - '**.rc'
      - '.github/workflows/android.yml'

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            tar \
            unzip \
            zip \
            file \
            binutils-aarch64-linux-gnu


      # ============================================================
      # DOWNLOAD FPC 3.2.0 NATIVE X86_64 LINUX
      # ============================================================
      - name: Download Free Pascal 3.2.0 host compiler
        run: |
          set -euxo pipefail

          FPC_HOST_URL="https://downloads.freepascal.org/fpc/dist/3.2.0/x86_64-linux/fpc-3.2.0-x86_64-linux.tar"

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -o /tmp/fpc-host.tar \
            "$FPC_HOST_URL"

          mkdir -p "$HOME/fpc-packages"

          tar -xf \
            /tmp/fpc-host.tar \
            -C "$HOME/fpc-packages"

          echo
          echo "===== FPC host installer ====="

          find "$HOME/fpc-packages/fpc-3.2.0-x86_64-linux" \
            -maxdepth 2 \
            -type f \
            -print \
            | sort


      # ============================================================
      # INSTALL NATIVE FPC
      # ============================================================
      - name: Install Free Pascal host compiler
        run: |
          set -euxo pipefail

          FPC_DIR="$HOME/fpc-packages/fpc-3.2.0-x86_64-linux"
          FPC_PREFIX="$HOME/fpc-install"

          test -f "$FPC_DIR/install.sh"

          chmod +x "$FPC_DIR/install.sh"

          mkdir -p "$FPC_PREFIX"

          cd "$FPC_DIR"

          echo
          echo "========================================"
          echo "Installing native Free Pascal 3.2.0"
          echo "========================================"

          printf '%s\n' \
            "$FPC_PREFIX" \
            "n" \
            "n" \
            "n" \
            | ./install.sh

          echo
          echo "===== Installed FPC ====="

          find "$FPC_PREFIX" \
            -maxdepth 4 \
            \( -type f -o -type l \) \
            | sort \
            | head -200


      # ============================================================
      # ADD NATIVE FPC TO PATH
      # ============================================================
      - name: Configure native FPC
        run: |
          set -euxo pipefail

          FPC_PREFIX="$HOME/fpc-install"

          test -d "$FPC_PREFIX/bin"

          echo "$FPC_PREFIX/bin" >> "$GITHUB_PATH"

          export PATH="$FPC_PREFIX/bin:$PATH"

          echo
          echo "===== Native FPC ====="

          command -v fpc
          command -v ppcx64

          fpc -iV
          ppcx64 -iV

          file "$(command -v fpc)"
          file "$(command -v ppcx64)"

          test "$(fpc -iV)" = "3.2.0"


      # ============================================================
      # DOWNLOAD AARCH64 ANDROID CROSS COMPILER
      # ============================================================
      - name: Download Free Pascal 3.2.0 AArch64 Android cross compiler
        run: |
          set -euxo pipefail

          CROSS_URL="https://downloads.freepascal.org/fpc/dist/3.2.0/x86_64-linux/fpc-3.2.0-aarch64-android.cross.x86_64-linux.tar"

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -o /tmp/fpc-aarch64-android-cross.tar \
            "$CROSS_URL"

          mkdir -p "$HOME/fpc-packages"

          tar -xf \
            /tmp/fpc-aarch64-android-cross.tar \
            -C "$HOME/fpc-packages"

          echo
          echo "===== AArch64 Android installer ====="

          find "$HOME/fpc-packages/fpc-3.2.0-aarch64-android.cross.x86_64-linux" \
            -maxdepth 2 \
            -type f \
            -print \
            | sort


      # ============================================================
      # INSTALL AARCH64 ANDROID CROSS COMPILER
      # ============================================================
      - name: Install AArch64 Android cross compiler
        run: |
          set -euxo pipefail

          export PATH="$HOME/fpc-install/bin:$PATH"

          CROSS_DIR="$HOME/fpc-packages/fpc-3.2.0-aarch64-android.cross.x86_64-linux"
          FPC_PREFIX="$HOME/fpc-install"

          test -f "$CROSS_DIR/install.sh"

          cd "$CROSS_DIR"

          echo
          echo "========================================"
          echo "Installing AArch64 Android cross FPC"
          echo "========================================"

          printf '%s\n' \
            "$FPC_PREFIX" \
            "n" \
            "n" \
            "n" \
            | ./install.sh

          echo
          echo "===== Installed cross compiler ====="

          find "$FPC_PREFIX" \
            -type f \
            \( \
              -name 'ppcrossa64' \
              -o -name 'ppca64' \
              -o -name 'ppc*a64' \
            \) \
            -print \
            | sort


      # ============================================================
      # VERIFY CROSS COMPILER
      # ============================================================
      - name: Verify AArch64 cross compiler
        run: |
          set -euxo pipefail

          FPC_PREFIX="$HOME/fpc-install"

          CROSS_COMPILER="$FPC_PREFIX/bin/x86_64-linux/ppcrossa64"

          echo
          echo "===== FPC ====="

          export PATH="$FPC_PREFIX/bin:$PATH"

          command -v fpc
          fpc -iV

          echo
          echo "===== AArch64 cross compiler ====="

          test -x "$CROSS_COMPILER"

          echo "CROSS_COMPILER=$CROSS_COMPILER"

          ls -lh "$CROSS_COMPILER"

          file "$CROSS_COMPILER"

          "$CROSS_COMPILER" -iV

          echo
          echo "===== AArch64 target ====="

          "$CROSS_COMPILER" -iTP
          "$CROSS_COMPILER" -iTO

          echo "CROSS_COMPILER=$CROSS_COMPILER" >> "$GITHUB_ENV"


      # ============================================================
      # CONFIGURE CROSS COMPILER PATH
      # ============================================================
      - name: Configure AArch64 cross compiler
        run: |
          set -euxo pipefail

          CROSS_BIN="$HOME/fpc-install/bin/x86_64-linux"

          test -d "$CROSS_BIN"
          test -x "$CROSS_BIN/ppcrossa64"

          echo "$CROSS_BIN" >> "$GITHUB_PATH"

          export PATH="$CROSS_BIN:$HOME/fpc-install/bin:$PATH"

          echo
          echo "===== Compiler commands ====="

          command -v fpc
          command -v ppcrossa64

          fpc -iV
          ppcrossa64 -iV


      # ============================================================
      # DOWNLOAD ANDROID NDK R20
      # ============================================================
      - name: Download Android NDK r20
        run: |
          set -euxo pipefail

          NDK_URL="https://dl.google.com/android/repository/android-ndk-r20-linux-x86_64.zip"

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -o /tmp/android-ndk-r20.zip \
            "$NDK_URL"

          mkdir -p "$HOME/android"

          unzip -q \
            /tmp/android-ndk-r20.zip \
            -d "$HOME/android"

          test -d "$HOME/android/android-ndk-r20"

          echo "ANDROID_NDK_HOME=$HOME/android/android-ndk-r20" \
            >> "$GITHUB_ENV"


      # ============================================================
      # CONFIGURE AARCH64 ANDROID TOOLCHAIN
      #
      # FIX:
      # GITHUB_PATH affects later steps only.
      # Export TOOLCHAIN_BIN here so command -v works NOW.
      # ============================================================
      - name: Configure Android AArch64 toolchain
        run: |
          set -euxo pipefail

          NDK="$ANDROID_NDK_HOME"

          echo
          echo "NDK:"
          echo "$NDK"

          TOOLCHAIN_BIN="$(
            find "$NDK/toolchains" \
              -type f \
              -name 'aarch64-linux-android-ld' \
              -print \
              | head -1 \
              | xargs -r dirname
          )"

          if [ -z "$TOOLCHAIN_BIN" ]; then
            echo
            echo "ERROR: AArch64 Android linker was not found."

            find "$NDK/toolchains" \
              -type f \
              -name '*aarch64*' \
              -print \
              | head -100

            exit 1
          fi

          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN"

          # Persist for following GitHub Actions steps.
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

          # Also activate immediately in THIS step.
          export PATH="$TOOLCHAIN_BIN:$PATH"

          echo
          echo "===== Android tools ====="

          command -v aarch64-linux-android-as
          command -v aarch64-linux-android-ld
          command -v aarch64-linux-android-ar
          command -v aarch64-linux-android-ranlib

          echo
          echo "===== Tool locations ====="

          ls -lh \
            "$TOOLCHAIN_BIN/aarch64-linux-android-as" \
            "$TOOLCHAIN_BIN/aarch64-linux-android-ld" \
            "$TOOLCHAIN_BIN/aarch64-linux-android-ar" \
            "$TOOLCHAIN_BIN/aarch64-linux-android-ranlib"


      # ============================================================
      # VERIFY ANDROID SYSROOT
      # ============================================================
      - name: Verify Android AArch64 sysroot
        run: |
          set -euxo pipefail

          NDK="$ANDROID_NDK_HOME"
          SYSROOT="$NDK/platforms/android-21/arch-arm64"

          test -d "$SYSROOT"
          test -d "$SYSROOT/usr"
          test -d "$SYSROOT/usr/lib"

          echo
          echo "Android AArch64 API 21 sysroot:"
          echo "$SYSROOT"

          ls -lh "$SYSROOT/usr/lib" | head -50


      # ============================================================
      # SHOW BOOOT SOURCE
      # ============================================================
      - name: Verify Booot project
        run: |
          set -euxo pipefail

          test -f booot7.dpr

          echo
          echo "===== Booot project ====="

          ls -lh booot7.dpr

          echo
          echo "===== Pascal source files ====="

          find . \
            -maxdepth 2 \
            -type f \
            -name '*.pas' \
            -print \
            | sort


      # ============================================================
      # BUILD BOOOT
      # ============================================================
      - name: Build Booot
        run: |
          set -euxo pipefail

          export PATH="$HOME/fpc-install/bin/x86_64-linux:$HOME/fpc-install/bin:$PATH"

          mkdir -p build
          mkdir -p build/units

          NDK="$ANDROID_NDK_HOME"
          SYSROOT="$NDK/platforms/android-21/arch-arm64"
          ANDROID_LIB="$SYSROOT/usr/lib"

          echo
          echo "========================================"
          echo "Building Booot"
          echo "Target: Android AArch64"
          echo "FPC:    $(fpc -iV)"
          echo "========================================"

          fpc \
            -Tandroid \
            -Paarch64 \
            -O3 \
            -OoREGVAR \
            -OoLOOPUNROLL \
            -Xs \
            -dBOOOT_ARM64 \
            -dANDROID \
            -dRELEASE \
            -FEbuild \
            -FUbuild/units \
            -Fu"$HOME/fpc-install/lib/fpc/3.2.0/units/aarch64-android/*" \
            -XPaarch64-linux-android- \
            -k"--sysroot=$SYSROOT" \
            -Fl"$ANDROID_LIB" \
            -Fi"$SYSROOT/usr/include" \
            booot7.dpr


      # ============================================================
      # VERIFY EXECUTABLE
      # ============================================================
      - name: Verify executable
        run: |
          set -euxo pipefail

          if [ ! -f build/booot7 ]; then
            echo
            echo "ERROR: Booot executable was not produced."
            echo
            echo "Build directory:"

            find build \
              -maxdepth 4 \
              -type f \
              -print

            exit 1
          fi

          chmod +x build/booot7

          echo
          echo "===== Booot binary ====="

          ls -lh build/booot7
          file build/booot7

          echo
          echo "===== ELF ====="

          readelf -h build/booot7 | \
            grep -E 'Class|Machine|Type'

          echo
          echo "===== Dependencies ====="

          readelf -d build/booot7 | \
            grep NEEDED || true


      # ============================================================
      # VERIFY NN FILES
      # ============================================================
      - name: Verify Booot neural networks
        run: |
          set -euxo pipefail

          for f in \
            booot2.nn \
            booot4.nn \
            booot58.nn
          do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing required network: $f"
              exit 1
            fi

            echo
            echo "$f:"

            ls -lh "$f"
          done


      # ============================================================
      # PREPARE PACKAGE
      # ============================================================
      - name: Prepare Android package
        run: |
          set -euxo pipefail

          rm -rf package
          mkdir -p package

          cp build/booot7 \
            package/booot7

          cp booot2.nn \
            package/booot2.nn

          cp booot4.nn \
            package/booot4.nn

          cp booot58.nn \
            package/booot58.nn

          chmod +x package/booot7

          echo
          echo "===== Final package ====="

          ls -lh package/


      # ============================================================
      # CREATE ZIP
      # ============================================================
      - name: Create ZIP
        run: |
          set -euxo pipefail

          cd package

          zip -9 \
            ../booot-android-arm64.zip \
            booot7 \
            booot2.nn \
            booot4.nn \
            booot58.nn

          cd ..

          echo
          echo "===== ZIP ====="

          ls -lh booot-android-arm64.zip

          unzip -l booot-android-arm64.zip


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: booot-android-arm64
          path: booot-android-arm64.zip
          if-no-files-found: error
