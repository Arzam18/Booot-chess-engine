name: Build Booot for Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - '**.pas'
      - '**.dpr'
      - '**.inc'
      - '**.rc'
      - '.github/workflows/android.yml'

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            tar \
            unzip \
            zip \
            file \
            binutils-aarch64-linux-gnu


      # ============================================================
      # DOWNLOAD FPC 3.2.0 HOST COMPILER
      # ============================================================
      - name: Download Free Pascal 3.2.0 host compiler
        run: |
          set -euxo pipefail

          FPC_HOST_URL="https://downloads.freepascal.org/fpc/dist/3.2.0/x86_64-linux/fpc-3.2.0-x86_64-linux.tar"

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -o /tmp/fpc-host.tar \
            "$FPC_HOST_URL"

          mkdir -p "$HOME/fpc"

          tar -xf \
            /tmp/fpc-host.tar \
            -C "$HOME/fpc"

          echo
          echo "===== Extracted FPC host package ====="

          find "$HOME/fpc" \
            -maxdepth 5 \
            -print \
            | head -200


      # ============================================================
      # DOWNLOAD AARCH64 ANDROID CROSS COMPILER
      # ============================================================
      - name: Download Free Pascal 3.2.0 AArch64 Android cross compiler
        run: |
          set -euxo pipefail

          CROSS_URL="https://downloads.freepascal.org/fpc/dist/3.2.0/x86_64-linux/fpc-3.2.0-aarch64-android.cross.x86_64-linux.tar"

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -o /tmp/fpc-aarch64-android-cross.tar \
            "$CROSS_URL"

          tar -xf \
            /tmp/fpc-aarch64-android-cross.tar \
            -C "$HOME/fpc"

          echo
          echo "===== Extracted AArch64 Android cross package ====="

          find "$HOME/fpc" \
            -maxdepth 6 \
            -print \
            | head -300


      # ============================================================
      # LOCATE FPC
      #
      # IMPORTANT:
      # FPC packages may contain symlinks.
      #
      # find -type f does NOT reliably find the compiler.
      # find -L follows those symlinks.
      # ============================================================
      - name: Locate Free Pascal
        id: fpc
        run: |
          set -euxo pipefail

          echo "Searching for host FPC..."

          FPC_BIN="$(
            find -L "$HOME/fpc" \
              -type f \
              -name fpc \
              | head -1
          )"

          echo "Searching for AArch64 cross compiler..."

          CROSS_FPC="$(
            find -L "$HOME/fpc" \
              -type f \
              -name ppcrossa64 \
              | head -1
          )"

          echo
          echo "FPC_BIN=$FPC_BIN"
          echo "CROSS_FPC=$CROSS_FPC"

          if [ -z "$FPC_BIN" ]; then
            echo
            echo "ERROR: Host FPC was not found."
            echo
            echo "All files containing 'fpc':"
            find -L "$HOME/fpc" \
              -iname '*fpc*' \
              -print \
              | head -300
            exit 1
          fi

          if [ -z "$CROSS_FPC" ]; then
            echo
            echo "ERROR: ppcrossa64 was not found."
            echo
            echo "All files containing 'ppcross':"
            find -L "$HOME/fpc" \
              -iname '*ppcross*' \
              -print \
              | head -300
            exit 1
          fi

          echo
          echo "===== Host compiler ====="

          ls -l "$FPC_BIN"
          file "$FPC_BIN"

          echo
          echo "===== AArch64 cross compiler ====="

          ls -l "$CROSS_FPC"
          file "$CROSS_FPC"

          echo
          echo "===== FPC version ====="

          "$FPC_BIN" -iV

          echo
          echo "===== Cross compiler version ====="

          "$CROSS_FPC" -iV

          echo "FPC_BIN=$FPC_BIN" >> "$GITHUB_ENV"
          echo "CROSS_FPC=$CROSS_FPC" >> "$GITHUB_ENV"


      # ============================================================
      # DOWNLOAD ANDROID NDK R20
      #
      # FPC 3.2.0's Android cross compiler uses the older Android
      # NDK layout.
      # ============================================================
      - name: Download Android NDK r20
        run: |
          set -euxo pipefail

          NDK_URL="https://dl.google.com/android/repository/android-ndk-r20-linux-x86_64.zip"

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -o /tmp/android-ndk-r20.zip \
            "$NDK_URL"

          mkdir -p "$HOME/android"

          unzip -q \
            /tmp/android-ndk-r20.zip \
            -d "$HOME/android"

          test -d "$HOME/android/android-ndk-r20"

          echo "ANDROID_NDK_HOME=$HOME/android/android-ndk-r20" \
            >> "$GITHUB_ENV"


      # ============================================================
      # LOCATE ANDROID AARCH64 TOOLCHAIN
      # ============================================================
      - name: Configure Android AArch64 toolchain
        run: |
          set -euxo pipefail

          NDK="$ANDROID_NDK_HOME"

          echo "NDK = $NDK"

          TOOLCHAIN_BIN="$(
            find "$NDK/toolchains" \
              -type f \
              -name 'aarch64-linux-android-ld' \
              | head -1 \
              | xargs -r dirname
          )"

          if [ -z "$TOOLCHAIN_BIN" ]; then
            echo
            echo "ERROR: Android AArch64 linker was not found."

            find "$NDK/toolchains" \
              -type f \
              -name '*aarch64*' \
              | head -100

            exit 1
          fi

          echo
          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN"

          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

          echo
          echo "===== Android tools ====="

          command -v aarch64-linux-android-as
          command -v aarch64-linux-android-ld
          command -v aarch64-linux-android-ar
          command -v aarch64-linux-android-ranlib

          file "$(command -v aarch64-linux-android-as)"
          file "$(command -v aarch64-linux-android-ld)"


      # ============================================================
      # VERIFY ANDROID API 21 AARCH64 SYSROOT
      # ============================================================
      - name: Verify Android sysroot
        run: |
          set -euxo pipefail

          NDK="$ANDROID_NDK_HOME"

          SYSROOT="$NDK/platforms/android-21/arch-arm64"

          echo "SYSROOT=$SYSROOT"

          test -d "$SYSROOT"

          test -d "$SYSROOT/usr"
          test -d "$SYSROOT/usr/lib"

          echo
          echo "Android AArch64 sysroot exists."

          echo
          echo "Libraries:"
          ls -lh "$SYSROOT/usr/lib" | head -50


      # ============================================================
      # DISPLAY PROJECT
      # ============================================================
      - name: Show Booot source
        run: |
          set -euxo pipefail

          echo "===== Booot project ====="

          test -f booot7.dpr

          echo
          echo "Project:"
          ls -lh booot7.dpr

          echo
          echo "Pascal sources:"
          find . \
            -maxdepth 2 \
            -type f \
            -name '*.pas' \
            -print \
            | sort


      # ============================================================
      # BUILD BOOOT
      # ============================================================
      - name: Build Booot
        run: |
          set -euxo pipefail

          mkdir -p build
          mkdir -p build/units

          NDK="$ANDROID_NDK_HOME"

          SYSROOT="$NDK/platforms/android-21/arch-arm64"

          ANDROID_LIB="$SYSROOT/usr/lib"

          echo
          echo "========================================"
          echo "Building Booot"
          echo "Target: Android AArch64"
          echo "FPC:    $("$FPC_BIN" -iV)"
          echo "========================================"

          "$FPC_BIN" \
            -Tandroid \
            -Paarch64 \
            -O3 \
            -OoREGVAR \
            -OoLOOPUNROLL \
            -Xs \
            -dBOOOT_ARM64 \
            -dANDROID \
            -dRELEASE \
            -FEbuild \
            -FUbuild/units \
            -Fu"$HOME/fpc/lib/fpc/3.2.0/units/aarch64-android/*" \
            -XPaarch64-linux-android- \
            -k"--sysroot=$SYSROOT" \
            -Fl"$ANDROID_LIB" \
            -Fi"$SYSROOT/usr/include" \
            booot7.dpr


      # ============================================================
      # VERIFY BUILD
      # ============================================================
      - name: Verify executable
        run: |
          set -euxo pipefail

          echo
          echo "===== Build output ====="

          find build \
            -maxdepth 3 \
            -type f \
            -print

          if [ ! -f build/booot7 ]; then

            echo
            echo "ERROR: build/booot7 was not produced."

            echo
            echo "Possible executables:"
            find build \
              -type f \
              -perm -111 \
              -print

            exit 1
          fi

          chmod +x build/booot7

          echo
          echo "===== Binary ====="

          ls -lh build/booot7

          file build/booot7

          echo
          echo "===== ELF header ====="

          readelf -h build/booot7 | \
            grep -E 'Class|Machine|Type'

          echo
          echo "===== ELF dependencies ====="

          readelf -d build/booot7 | \
            grep NEEDED || true


      # ============================================================
      # CHECK REQUIRED NN FILES
      # ============================================================
      - name: Verify Booot neural networks
        run: |
          set -euxo pipefail

          echo "Checking Booot NN files..."

          for f in \
            booot2.nn \
            booot4.nn \
            booot58.nn
          do
            if [ ! -f "$f" ]; then
              echo
              echo "ERROR: Missing required network:"
              echo "$f"
              exit 1
            fi

            echo
            echo "$f:"
            ls -lh "$f"
          done


      # ============================================================
      # PREPARE FINAL PACKAGE
      # ============================================================
      - name: Prepare Android package
        run: |
          set -euxo pipefail

          rm -rf package

          mkdir -p package

          cp build/booot7 \
            package/booot7

          cp booot2.nn \
            package/booot2.nn

          cp booot4.nn \
            package/booot4.nn

          cp booot58.nn \
            package/booot58.nn

          chmod +x package/booot7

          echo
          echo "===== Final package ====="

          ls -lh package/


      # ============================================================
      # CREATE ZIP
      # ============================================================
      - name: Create ZIP
        run: |
          set -euxo pipefail

          cd package

          zip -9 \
            ../booot-android-arm64.zip \
            booot7 \
            booot2.nn \
            booot4.nn \
            booot58.nn

          cd ..

          echo
          echo "===== ZIP ====="

          ls -lh booot-android-arm64.zip

          echo
          unzip -l booot-android-arm64.zip


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: booot-android-arm64
          path: booot-android-arm64.zip
          if-no-files-found: error
